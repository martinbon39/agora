name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Sessions are tmux sessions, and gate-socket / gate-ws / gate-rooms /
      # gate-sandbox start real ones. bwrap is deliberately NOT installed:
      # gate-sandbox prints SKIP without it, and user namespaces on a hosted
      # runner are not the environment its assertions are about. Run it on a
      # real box before touching the sandbox.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      # node-pty and better-sqlite3 are native modules built from source here
      - name: Install dependencies
        run: npm ci

      # `tsc -b && vite build` for the web workspace, `tsc` for the server:
      # this is the typecheck as well as the build
      - name: Build
        run: npm run build

      # Every headless gate, each in a throwaway AGORA_DATA_DIR. Most are
      # fastify.inject against the real routes; gate-socket and gate-ws spawn
      # the real server, and gate-ws spends ~50s waiting out a heartbeat.
      - name: Gates
        run: npm test

      # cli/agora is a node script despite having no extension — checking it
      # with bash -n fails on the first comment line
      - name: Check scripts parse
        run: |
          for f in deploy/provision.sh deploy/sync.sh deploy/agoractl deploy/xclip; do
            bash -n "$f"
          done
          for f in cli/agora deploy/gate-mobile-ime.mjs deploy/gate-paste.mjs; do
            node --check "$f"
          done
