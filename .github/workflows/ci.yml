name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # sessions are tmux sessions; the hermetic gates don't spawn one, but the
      # server imports the module that shells out to it
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      # node-pty and better-sqlite3 are native modules built from source here
      - name: Install dependencies
        run: npm ci

      # `tsc -b && vite build` for the web workspace, `tsc` for the server:
      # this is the typecheck as well as the build
      - name: Build
        run: npm run build

      # gate-canvas / gate-chat / gate-scope are hermetic — fastify.inject
      # against the real routes, in a throwaway ARGOS_DATA_DIR
      - name: Gates
        run: npm test

      # cli/argos is a node script despite having no extension — checking it
      # with bash -n fails on the first comment line
      - name: Check scripts parse
        run: |
          for f in deploy/provision.sh deploy/sync.sh deploy/argosctl deploy/xclip; do
            bash -n "$f"
          done
          for f in cli/argos deploy/gate-mobile-ime.mjs deploy/gate-paste.mjs; do
            node --check "$f"
          done
